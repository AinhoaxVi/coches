<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111916" />
  <meta name="description" content="Garaje, mantenimiento, códigos OBD y orientación mecánica con triaje de seguridad." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=10" />
  <title>MotorClaro</title>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 23V9h4l7 9 7-9h4v14h-4v-8l-7 8-7-8v8z"/></svg></span>
        <span>MotorClaro</span><small>v2.2</small>
      </button>
      <button id="profileButton" class="avatar" aria-label="Abrir ajustes y perfil">A</button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-view="home"><span aria-hidden="true">⌂</span><small>Inicio</small></button>
      <button class="nav-item" data-view="garage"><span aria-hidden="true">▰</span><small>Garaje</small></button>
      <button class="nav-item nav-main" data-view="diagnosis"><span aria-hidden="true">✦</span><small>Diagnóstico</small></button>
      <button class="nav-item" data-view="maintenance"><span aria-hidden="true">✓</span><small>Cuidados</small></button>
      <button class="nav-item" data-view="history"><span aria-hidden="true">◷</span><small>Historial</small></button>
    </nav>
  </div>

  <div id="sheet" class="sheet-backdrop hidden" role="presentation">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><div class="sheet-handle" aria-hidden="true"></div><button class="sheet-close" data-close aria-label="Cerrar">×</button></div>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="updateBanner" class="update-banner hidden" role="status"><span>Hay una versión nueva de MotorClaro.</span><button id="reloadUpdate">Actualizar</button></div>
  <input id="importFile" class="hidden" type="file" accept="application/json,.json" />
  <script src="./catalog.js?v=10"></script>
  <script src="./diagnosis-data.js?v=10"></script>
  <script src="./maintenance-data.js?v=10"></script>
  <script src="./app.js?v=10"></script>
</body>
</html>
